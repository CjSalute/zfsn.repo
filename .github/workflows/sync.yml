name: 同步 Wkkyy00 插件

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出自己的仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: 同步并检查插件
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import shutil
          import subprocess
          import tempfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          UPSTREAM_PACKAGES = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/Packages"
          )

          UPSTREAM_BASE = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/"
          )

          DEBS = Path("debs")
          ARCHIVE = Path("archive")

          DEBS.mkdir(exist_ok=True)
          ARCHIVE.mkdir(exist_ok=True)

          # ============================================================
          # 下载文件
          # ============================================================

          def download_file(url, destination, retries=3):
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      print(f"下载尝试 {attempt}/{retries}")

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "Mozilla/5.0 GitHub-Actions-Sileo-Sync"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          with open(destination, "wb") as output:
                              while True:
                                  data = response.read(1024 * 1024)

                                  if not data:
                                      break

                                  output.write(data)

                      if (
                          destination.exists()
                          and destination.stat().st_size > 0
                      ):
                          return

                      raise RuntimeError("下载文件为空")

                  except Exception as e:
                      last_error = e

                      print(f"下载失败：{e}")

                      if attempt < retries:
                          print("等待 5 秒后重试...")
                          time.sleep(5)

              raise RuntimeError(
                  f"下载失败，已重试 {retries} 次：{last_error}"
              )

          # ============================================================
          # 解析 Packages
          # ============================================================

          def parse_packages(text):
              result = []
              current = {}

              for line in text.splitlines():

                  if not line.strip():

                      if current:
                          result.append(current)
                          current = {}

                      continue

                  if line.startswith(" ") or line.startswith("\t"):
                      continue

                  if ":" in line:
                      key, value = line.split(":", 1)

                      current[key.strip()] = value.strip()

              if current:
                  result.append(current)

              return result

          # ============================================================
          # dpkg 信息
          # 修复：stderr 与 stdout 分离
          # 避免 dpkg-deb warning 污染 Package / Version / Architecture
          # ============================================================

          def deb_info(path):

              def get(field):
                  result = subprocess.run(
                      [
                          "dpkg-deb",
                          "-f",
                          str(path),
                          field
                      ],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True
                  )

                  return result.stdout.strip()

              return {
                  "Package": get("Package"),
                  "Version": get("Version"),
                  "Architecture": get("Architecture")
              }

          # ============================================================
          # SHA256
          # ============================================================

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:
                      data = f.read(1024 * 1024)

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          # ============================================================
          # 文件大小
          # ============================================================

          def file_size(path):
              return path.stat().st_size

          # ============================================================
          # Debian 版本比较
          # ============================================================

          def version_gt(new, old):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      new,
                      "gt",
                      old
                  ]
              ).returncode == 0

          def version_eq(a, b):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      a,
                      "eq",
                      b
                  ]
              ).returncode == 0

          # ============================================================
          # 获取上游 Packages
          # ============================================================

          print("================================")
          print("正在获取上游 Packages...")
          print("================================")

          packages_temp = Path(tempfile.mktemp())

          try:

              download_file(
                  UPSTREAM_PACKAGES,
                  packages_temp
              )

              packages_text = packages_temp.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

          finally:

              if packages_temp.exists():
                  packages_temp.unlink()

          upstream_all = parse_packages(packages_text)

          print(
              f"上游原始插件记录：{len(upstream_all)}"
          )

          # ============================================================
          # 同一个 Package 只保留上游最高版本
          # ============================================================

          upstream = {}

          for pkg in upstream_all:

              package_id = pkg.get("Package", "").strip()
              version = pkg.get("Version", "").strip()

              if not package_id or not version:
                  continue

              key = package_id.lower()

              if key not in upstream:

                  upstream[key] = pkg

              else:

                  old_version = (
                      upstream[key]
                      .get("Version", "")
                      .strip()
                  )

                  if version_gt(version, old_version):

                      upstream[key] = pkg

          print(
              f"去重后上游插件数量：{len(upstream)}"
          )

          # ============================================================
          # 检查本地插件
          # ============================================================

          print()
          print("================================")
          print("正在检查本地插件...")
          print("================================")

          local = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info["Package"]
                  key = package_id.lower()

                  item = {
                      **info,
                      "Filename": path.name,
                      "Path": path,
                      "Size": file_size(path),
                      "SHA256": sha256(path)
                  }

                  if key not in local:

                      local[key] = item

                  else:

                      old = local[key]

                      if version_gt(
                          item["Version"],
                          old["Version"]
                      ):

                          local[key] = item

              except Exception as e:

                  print(
                      f"警告：无法读取 {path}: {e}"
                  )

          print(
              f"本地插件数量：{len(local)}"
          )

          # ============================================================
          # 下载并验证上游插件
          # ============================================================

          def download_and_validate(pkg):

              package_id = (
                  pkg.get("Package", "")
                  .strip()
              )

              filename = pkg.get("Filename")

              if not filename:

                  raise RuntimeError(
                      f"{package_id} 没有 Filename 字段"
                  )

              filename = filename.strip()

              while filename.startswith("./"):
                  filename = filename[2:]

              filename = filename.lstrip("/")

              encoded_filename = quote(
                  filename,
                  safe="/"
              )

              url = (
                  UPSTREAM_BASE
                  + encoded_filename
              )

              print()
              print(
                  f"正在下载："
                  f"{package_id} "
                  f"{pkg.get('Version', '')}"
              )

              print(
                  f"地址：{url}"
              )

              temp = Path(
                  tempfile.mktemp(
                      suffix=".deb"
                  )
              )

              try:

                  # ----------------------------------------------------
                  # 下载
                  # ----------------------------------------------------

                  download_file(
                      url,
                      temp,
                      retries=3
                  )

                  # ----------------------------------------------------
                  # 文件大小
                  # ----------------------------------------------------

                  actual_size = temp.stat().st_size

                  expected_size = pkg.get("Size")

                  if expected_size:

                      expected_size = int(
                          expected_size
                      )

                      if (
                          actual_size
                          != expected_size
                      ):

                          raise RuntimeError(
                              "文件大小不一致："
                              f"{actual_size} "
                              f"!= "
                              f"{expected_size}"
                          )

                  print(
                      "✓ 文件大小检查通过："
                      f"{actual_size} bytes"
                  )

                  # ----------------------------------------------------
                  # SHA256
                  # ----------------------------------------------------

                  actual_sha = sha256(temp)

                  expected_sha = pkg.get(
                      "SHA256"
                  )

                  if expected_sha:

                      if (
                          actual_sha.lower()
                          != expected_sha.lower()
                      ):

                          raise RuntimeError(
                              "SHA256 校验失败："
                              f"{actual_sha} "
                              f"!= "
                              f"{expected_sha}"
                          )

                  print(
                      "✓ SHA256 校验通过："
                      f"{actual_sha}"
                  )

                  # ----------------------------------------------------
                  # 读取 DEB 信息
                  # ----------------------------------------------------

                  info = deb_info(temp)

                  expected_package = (
                      pkg.get("Package", "")
                      .strip()
                  )

                  actual_package = (
                      info["Package"]
                      .strip()
                  )

                  if (
                      actual_package.lower()
                      != expected_package.lower()
                  ):

                      raise RuntimeError(
                          "Package 不一致："
                          f"{actual_package} "
                          f"!= "
                          f"{expected_package}"
                      )

                  expected_version = (
                      pkg.get("Version", "")
                      .strip()
                  )

                  actual_version = (
                      info["Version"]
                      .strip()
                  )

                  if (
                      actual_version
                      != expected_version
                  ):

                      raise RuntimeError(
                          "Version 不一致："
                          f"{actual_version} "
                          f"!= "
                          f"{expected_version}"
                      )

                  expected_arch = (
                      pkg.get(
                          "Architecture",
                          ""
                      )
                      .strip()
                  )

                  actual_arch = (
                      info["Architecture"]
                      .strip()
                  )

                  if (
                      actual_arch
                      != expected_arch
                  ):

                      raise RuntimeError(
                          "Architecture 不一致："
                          f"{actual_arch} "
                          f"!= "
                          f"{expected_arch}"
                      )

                  print("✓ Package 检查通过")
                  print("✓ Version 检查通过")
                  print("✓ Architecture 检查通过")

                  # ----------------------------------------------------
                  # DEB 完整性
                  # ----------------------------------------------------

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--info",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--contents",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  print(
                      "✓ .deb 完整性检查通过"
                  )

                  return temp, filename

              except Exception:

                  if temp.exists():
                      temp.unlink()

                  raise

          # ============================================================
          # 同步
          # ============================================================

          warnings = []

          added = 0
          updated = 0
          skipped = 0
          conflicts = 0

          for key, pkg in upstream.items():

              package_id = (
                  pkg.get("Package", "")
                  .strip()
              )

              upstream_version = (
                  pkg.get("Version", "")
                  .strip()
              )

              if (
                  not package_id
                  or not upstream_version
              ):
                  continue

              current = local.get(key)

              # ========================================================
              # 本地已经存在
              # ========================================================

              if current:

                  # ----------------------------------------------------
                  # 上游版本更高
                  # ----------------------------------------------------

                  if version_gt(
                      upstream_version,
                      current["Version"]
                  ):

                      print()
                      print(
                          f"发现更新：{package_id}"
                      )

                      print(
                          f"本地版本："
                          f"{current['Version']}"
                      )

                      print(
                          f"上游版本："
                          f"{upstream_version}"
                      )

                      temp, filename = (
                          download_and_validate(pkg)
                      )

                      new_path = (
                          DEBS
                          / Path(filename).name
                      )

                      # ------------------------------------------------
                      # 文件名冲突检查
                      # ------------------------------------------------

                      if new_path.exists():

                          existing_info = (
                              deb_info(new_path)
                          )

                          if (
                              existing_info[
                                  "Package"
                              ].lower()
                              != package_id.lower()
                          ):

                              temp.unlink()

                              raise RuntimeError(
                                  "文件名冲突："
                                  f"{new_path}"
                              )

                      # ------------------------------------------------
                      # 保存旧版本
                      # ------------------------------------------------

                      old_path = current["Path"]

                      if old_path.exists():

                          archive_dir = (
                              ARCHIVE
                              / package_id
                          )

                          archive_dir.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          archive_path = (
                              archive_dir
                              / old_path.name
                          )

                          if archive_path.exists():

                              old_sha = sha256(
                                  old_path
                              )

                              archive_path = (
                                  archive_dir
                                  /
                                  f"{old_path.stem}."
                                  f"{old_sha[:8]}.deb"
                              )

                          print(
                              "保留历史版本："
                              f"{current['Version']} "
                              "→ "
                              f"{archive_path}"
                          )

                          shutil.move(
                              str(old_path),
                              str(archive_path)
                          )

                      # ------------------------------------------------
                      # 保存新版本
                      # ------------------------------------------------

                      shutil.copy2(
                          temp,
                          new_path
                      )

                      temp.unlink()

                      updated += 1

                      print(
                          "✓ 更新成功："
                          f"{package_id} "
                          f"{upstream_version}"
                      )

                  # ----------------------------------------------------
                  # 版本相同
                  # ----------------------------------------------------

                  elif version_eq(
                      upstream_version,
                      current["Version"]
                  ):

                      upstream_sha = (
                          pkg.get("SHA256")
                      )

                      # -----------------------------------------------
                      # SHA 相同
                      # -----------------------------------------------

                      if (
                          upstream_sha
                          and
                          current["SHA256"].lower()
                          ==
                          upstream_sha.lower()
                      ):

                          skipped += 1

                          print(
                              f"跳过：{package_id} "
                              f"{upstream_version} "
                              "（版本和内容相同）"
                          )

                      # -----------------------------------------------
                      # SHA 不同
                      # -----------------------------------------------

                      elif upstream_sha:

                          conflicts += 1

                          message = (
                              "⚠ 同版本 SHA256 不一致："
                              f"{package_id} "
                              f"{upstream_version}\n"
                              f"本地："
                              f"{current['SHA256']}\n"
                              f"上游："
                              f"{upstream_sha}\n"
                              "本次保留本地文件，"
                              "不会覆盖。"
                          )

                          print()
                          print(
                              "================================"
                          )
                          print(message)
                          print(
                              "================================"
                          )

                          warnings.append(message)

                          skipped += 1

                      else:

                          skipped += 1

                          print(
                              f"跳过：{package_id} "
                              f"{upstream_version} "
                              "（版本相同）"
                          )

                  # ----------------------------------------------------
                  # 本地版本更高
                  # ----------------------------------------------------

                  else:

                      skipped += 1

                      print(
                          f"跳过：{package_id} "
                          f"本地 "
                          f"{current['Version']} "
                          f"> 上游 "
                          f"{upstream_version}"
                      )

                  continue

              # ========================================================
              # 新插件
              # ========================================================

              print()
              print(
                  f"发现新插件："
                  f"{package_id} "
                  f"{upstream_version}"
              )

              temp, filename = (
                  download_and_validate(pkg)
              )

              new_path = (
                  DEBS
                  / Path(filename).name
              )

              # --------------------------------------------------------
              # 文件名冲突
              # --------------------------------------------------------

              if new_path.exists():

                  existing_info = (
                      deb_info(new_path)
                  )

                  if (
                      existing_info[
                          "Package"
                      ].lower()
                      != package_id.lower()
                  ):

                      temp.unlink()

                      raise RuntimeError(
                          "文件名冲突："
                          f"{new_path}"
                      )

              # --------------------------------------------------------
              # 保存
              # --------------------------------------------------------

              shutil.copy2(
                  temp,
                  new_path
              )

              temp.unlink()

              added += 1

              print(
                  "✓ 新插件添加成功："
                  f"{package_id} "
                  f"{upstream_version}"
              )

          # ============================================================
          # 清理 debs 中重复 Package
          # ============================================================

          print()
          print(
              "================================"
          )
          print(
              "正在检查 debs 中是否存在重复版本..."
          )
          print(
              "================================"
          )

          package_files = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info["Package"]
                  key = package_id.lower()

                  package_files.setdefault(
                      key,
                      []
                  ).append(
                      (
                          path,
                          info["Version"],
                          package_id
                      )
                  )

              except Exception:
                  continue

          for key, files in package_files.items():

              if len(files) <= 1:
                  continue

              newest = files[0]

              for item in files[1:]:

                  if version_gt(
                      item[1],
                      newest[1]
                  ):

                      newest = item

              for (
                  path,
                  version,
                  package_id
              ) in files:

                  if path == newest[0]:
                      continue

                  archive_dir = (
                      ARCHIVE
                      / package_id
                  )

                  archive_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  target = (
                      archive_dir
                      / path.name
                  )

                  if target.exists():

                      target = (
                          archive_dir
                          /
                          f"{path.stem}."
                          f"{sha256(path)[:8]}.deb"
                      )

                  print(
                      "移动历史版本："
                      f"{package_id} "
                      f"{version}"
                  )

                  shutil.move(
                      str(path),
                      str(target)
                  )

          # ============================================================
          # 最终统计
          # ============================================================

          print()
          print(
              "================================"
          )
          print(
              "同步检查完成"
          )
          print(
              "================================"
          )

          print(
              f"新增插件：{added}"
          )

          print(
              f"更新插件：{updated}"
          )

          print(
              f"跳过插件：{skipped}"
          )

          print(
              f"SHA256 冲突：{conflicts}"
          )

          if warnings:

              print()
              print(
                  "================================"
              )

              print(
                  "以下插件存在同版本 SHA256 不一致："
              )

              for warning in warnings:

                  print()
                  print(warning)

              print(
                  "================================"
              )

              print(
                  "以上插件已保留本地版本，"
                  "不会覆盖。"
              )

          PY

      - name: 重新生成 Packages
        run: |
          echo "正在重新生成 Packages..."

          dpkg-scanpackages debs /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -f Packages -o Packages.zst

          echo "Packages 生成完成。"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            debs \
            archive \
            Packages \
            Packages.gz \
            Packages.bz2 \
            Packages.xz \
            Packages.zst

          if git diff --cached --quiet; then
            echo "没有新的插件或更新。"
          else
            echo "发现文件变化，开始提交..."

            git commit \
              -m "自动同步 Wkkyy00 插件"

            git push

            echo "同步内容已经提交到仓库。"
          fi
