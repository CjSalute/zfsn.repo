name: 同步 Wkkyy00 + Huayuarc 插件

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出自己的仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: 同步并检查插件
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import shutil
          import subprocess
          import tempfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          # ============================================================
          # 上游源
          # ============================================================

          UPSTREAMS = [
              {
                  "name": "Wkkyy00",
                  "packages": (
                      "https://raw.githubusercontent.com/"
                      "Wkkyy00/Wkkyy00.github.io/main/Packages"
                  ),
                  "base": (
                      "https://raw.githubusercontent.com/"
                      "Wkkyy00/Wkkyy00.github.io/main/"
                  ),
              },
              {
                  "name": "Huayuarc",
                  "packages": (
                      "https://raw.githubusercontent.com/"
                      "huayuarc/huayuarc.github.io/main/Packages"
                  ),
                  "base": (
                      "https://raw.githubusercontent.com/"
                      "huayuarc/huayuarc.github.io/main/"
                  ),
              },
          ]

          DEBS = Path("debs")
          ARCHIVE = Path("archive")

          DEBS.mkdir(exist_ok=True)
          ARCHIVE.mkdir(exist_ok=True)

          # ============================================================
          # 下载文件
          # ============================================================

          def download_file(url, destination, retries=3):

              last_error = None

              for attempt in range(1, retries + 1):

                  try:

                      print(
                          f"下载尝试 {attempt}/{retries}"
                      )

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "Mozilla/5.0 GitHub-Actions-Sileo-Sync"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          with open(
                              destination,
                              "wb"
                          ) as output:

                              while True:

                                  data = response.read(
                                      1024 * 1024
                                  )

                                  if not data:
                                      break

                                  output.write(data)

                      if (
                          destination.exists()
                          and destination.stat().st_size > 0
                      ):

                          return

                      raise RuntimeError(
                          "下载文件为空"
                      )

                  except Exception as e:

                      last_error = e

                      print(
                          f"下载失败：{e}"
                      )

                      if attempt < retries:

                          print(
                              "等待 5 秒后重试..."
                          )

                          time.sleep(5)

              raise RuntimeError(
                  f"下载失败，已重试 {retries} 次："
                  f"{last_error}"
              )

          # ============================================================
          # 解析 Packages
          #
          # 重点修复：
          # Debian Packages 允许字段跨多行。
          #
          # 例如：
          #
          # Filename: debs/com.xxx
          # -1.0.0
          # -roothide.deb
          #
          # 必须合并为：
          #
          # Filename: debs/com.xxx-1.0.0-roothide.deb
          # ============================================================

          def parse_packages(text):

              result = []
              current = {}
              last_key = None

              for raw_line in text.splitlines():

                  # 空行 = 一个 Package 记录结束
                  if not raw_line.strip():

                      if current:
                          result.append(current)

                      current = {}
                      last_key = None
                      continue

                  # ----------------------------------------------------
                  # 多行字段续行
                  # ----------------------------------------------------

                  if (
                      raw_line.startswith(" ")
                      or raw_line.startswith("\t")
                      or (
                          current
                          and ":" not in raw_line
                      )
                  ):

                      if last_key is not None:

                          continuation = raw_line.strip()

                          current[last_key] = (
                              current[last_key]
                              + continuation
                          )

                      continue

                  # ----------------------------------------------------
                  # 正常字段
                  # ----------------------------------------------------

                  if ":" in raw_line:

                      key, value = raw_line.split(
                          ":",
                          1
                      )

                      key = key.strip()
                      value = value.strip()

                      current[key] = value
                      last_key = key

              if current:
                  result.append(current)

              return result

          # ============================================================
          # dpkg 信息
          # ============================================================

          def deb_info(path):

              def get(field):

                  result = subprocess.run(
                      [
                          "dpkg-deb",
                          "-f",
                          str(path),
                          field
                      ],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=True
                  )

                  return result.stdout.strip()

              return {
                  "Package": get("Package"),
                  "Version": get("Version"),
                  "Architecture": get("Architecture")
              }

          # ============================================================
          # SHA256
          # ============================================================

          def sha256(path):

              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:

                      data = f.read(
                          1024 * 1024
                      )

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          # ============================================================
          # 文件大小
          # ============================================================

          def file_size(path):

              return path.stat().st_size

          # ============================================================
          # Debian 版本比较
          # ============================================================

          def version_gt(new, old):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      new,
                      "gt",
                      old
                  ]
              ).returncode == 0

          def version_eq(a, b):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      a,
                      "eq",
                      b
                  ]
              ).returncode == 0

          # ============================================================
          # 获取所有上游 Packages
          # ============================================================

          print()
          print("================================")
          print("正在获取所有上游 Packages...")
          print("================================")

          upstream_all = []

          for source in UPSTREAMS:

              print()
              print("--------------------------------")
              print(
                  f"正在获取：{source['name']}"
              )
              print("--------------------------------")

              packages_temp = Path(
                  tempfile.mktemp()
              )

              try:

                  download_file(
                      source["packages"],
                      packages_temp
                  )

                  packages_text = (
                      packages_temp.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )
                  )

                  packages = parse_packages(
                      packages_text
                  )

                  print(
                      f"{source['name']} "
                      f"原始插件记录："
                      f"{len(packages)}"
                  )

                  for pkg in packages:

                      pkg["_source"] = (
                          source["name"]
                      )

                      pkg["_base"] = (
                          source["base"]
                      )

                      upstream_all.append(
                          pkg
                      )

              finally:

                  if packages_temp.exists():
                      packages_temp.unlink()

          print()
          print(
              "两个上游合计原始插件记录："
              f"{len(upstream_all)}"
          )

          # ============================================================
          # 上游去重
          #
          # 重要：
          # Package + Architecture 才作为唯一标识。
          #
          # 例如：
          #
          # com.xxx + iphoneos-arm64
          # com.xxx + iphoneos-arm64e
          #
          # 两个都保留。
          # ============================================================

          upstream = {}

          for pkg in upstream_all:

              package_id = (
                  pkg.get("Package", "")
                  .strip()
              )

              version = (
                  pkg.get("Version", "")
                  .strip()
              )

              architecture = (
                  pkg.get("Architecture", "")
                  .strip()
              )

              if (
                  not package_id
                  or not version
                  or not architecture
              ):

                  continue

              key = (
                  package_id.lower(),
                  architecture.lower()
              )

              if key not in upstream:

                  upstream[key] = pkg

              else:

                  old = upstream[key]

                  old_version = (
                      old.get("Version", "")
                      .strip()
                  )

                  # ----------------------------------------------------
                  # 新版本更高
                  # ----------------------------------------------------

                  if version_gt(
                      version,
                      old_version
                  ):

                      upstream[key] = pkg

                  # ----------------------------------------------------
                  # 版本相同：
                  # 优先选择 Filename 完整的记录
                  # ----------------------------------------------------

                  elif version_eq(
                      version,
                      old_version
                  ):

                      old_filename = (
                          old.get(
                              "Filename",
                              ""
                          )
                      )

                      new_filename = (
                          pkg.get(
                              "Filename",
                              ""
                          )
                      )

                      old_valid = (
                          old_filename
                          .lower()
                          .endswith(".deb")
                      )

                      new_valid = (
                          new_filename
                          .lower()
                          .endswith(".deb")
                      )

                      if (
                          new_valid
                          and not old_valid
                      ):

                          upstream[key] = pkg

          print()
          print(
              "所有上游去重后插件数量："
              f"{len(upstream)}"
          )

          # ============================================================
          # 检查本地插件
          # ============================================================

          print()
          print("================================")
          print("正在检查本地插件...")
          print("================================")

          local = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = (
                      info["Package"]
                  )

                  architecture = (
                      info["Architecture"]
                  )

                  key = (
                      package_id.lower(),
                      architecture.lower()
                  )

                  item = {
                      **info,
                      "Filename": path.name,
                      "Path": path,
                      "Size": file_size(path),
                      "SHA256": sha256(path)
                  }

                  if key not in local:

                      local[key] = item

                  else:

                      old = local[key]

                      if version_gt(
                          item["Version"],
                          old["Version"]
                      ):

                          local[key] = item

              except Exception as e:

                  print(
                      f"警告：无法读取 "
                      f"{path}: {e}"
                  )

          print(
              f"本地插件数量："
              f"{len(local)}"
          )

          # ============================================================
          # 下载并验证上游插件
          # ============================================================

          def download_and_validate(pkg):

              package_id = (
                  pkg.get("Package", "")
                  .strip()
              )

              filename = (
                  pkg.get("Filename", "")
                  .strip()
              )

              if not filename:

                  raise RuntimeError(
                      f"{package_id} "
                      "没有 Filename 字段"
                  )

              while filename.startswith("./"):

                  filename = filename[2:]

              filename = filename.lstrip("/")

              # --------------------------------------------------------
              # 检查 Filename 是否已经正确
              # --------------------------------------------------------

              encoded_filename = quote(
                  filename,
                  safe="/"
              )

              base_url = pkg.get(
                  "_base",
                  ""
              )

              url = (
                  base_url
                  + encoded_filename
              )

              source = pkg.get(
                  "_source",
                  "未知"
              )

              version = (
                  pkg.get("Version", "")
                  .strip()
              )

              architecture = (
                  pkg.get(
                      "Architecture",
                      ""
                  ).strip()
              )

              print()
              print(
                  "正在下载："
                  f"{package_id} "
                  f"{version}"
              )

              print(
                  f"架构：{architecture}"
              )

              print(
                  f"来源：{source}"
              )

              print(
                  f"地址：{url}"
              )

              temp = Path(
                  tempfile.mktemp(
                      suffix=".deb"
                  )
              )

              try:

                  # ----------------------------------------------------
                  # 下载
                  # ----------------------------------------------------

                  download_file(
                      url,
                      temp,
                      retries=3
                  )

                  # ----------------------------------------------------
                  # 文件大小
                  # ----------------------------------------------------

                  actual_size = (
                      temp.stat().st_size
                  )

                  expected_size = (
                      pkg.get("Size")
                  )

                  if expected_size:

                      expected_size = int(
                          expected_size
                      )

                      if (
                          actual_size
                          != expected_size
                      ):

                          raise RuntimeError(
                              "文件大小不一致："
                              f"{actual_size} "
                              f"!= "
                              f"{expected_size}"
                          )

                  print(
                      "✓ 文件大小检查通过："
                      f"{actual_size} bytes"
                  )

                  # ----------------------------------------------------
                  # SHA256
                  # ----------------------------------------------------

                  actual_sha = sha256(
                      temp
                  )

                  expected_sha = pkg.get(
                      "SHA256"
                  )

                  if expected_sha:

                      if (
                          actual_sha.lower()
                          != expected_sha.lower()
                      ):

                          raise RuntimeError(
                              "SHA256 校验失败："
                              f"{actual_sha} "
                              f"!= "
                              f"{expected_sha}"
                          )

                  print(
                      "✓ SHA256 校验通过："
                      f"{actual_sha}"
                  )

                  # ----------------------------------------------------
                  # DEB 信息
                  # ----------------------------------------------------

                  info = deb_info(temp)

                  expected_package = (
                      pkg.get(
                          "Package",
                          ""
                      ).strip()
                  )

                  actual_package = (
                      info["Package"]
                      .strip()
                  )

                  if (
                      actual_package.lower()
                      != expected_package.lower()
                  ):

                      raise RuntimeError(
                          "Package 不一致："
                          f"{actual_package} "
                          f"!= "
                          f"{expected_package}"
                      )

                  expected_version = (
                      pkg.get(
                          "Version",
                          ""
                      ).strip()
                  )

                  actual_version = (
                      info["Version"]
                      .strip()
                  )

                  if (
                      actual_version
                      != expected_version
                  ):

                      raise RuntimeError(
                          "Version 不一致："
                          f"{actual_version} "
                          f"!= "
                          f"{expected_version}"
                      )

                  expected_arch = (
                      pkg.get(
                          "Architecture",
                          ""
                      ).strip()
                  )

                  actual_arch = (
                      info["Architecture"]
                      .strip()
                  )

                  if (
                      actual_arch
                      != expected_arch
                  ):

                      raise RuntimeError(
                          "Architecture 不一致："
                          f"{actual_arch} "
                          f"!= "
                          f"{expected_arch}"
                      )

                  print(
                      "✓ Package 检查通过"
                  )

                  print(
                      "✓ Version 检查通过"
                  )

                  print(
                      "✓ Architecture 检查通过"
                  )

                  # ----------------------------------------------------
                  # DEB 完整性
                  # ----------------------------------------------------

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--info",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--contents",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  print(
                      "✓ .deb 完整性检查通过"
                  )

                  return temp, filename

              except Exception:

                  if temp.exists():
                      temp.unlink()

                  raise

          # ============================================================
          # 同步
          # ============================================================

          warnings = []

          added = 0
          updated = 0
          skipped = 0
          conflicts = 0
          failed = 0

          # ============================================================
          # 逐个同步
          # ============================================================

          for key, pkg in upstream.items():

              package_id = (
                  pkg.get("Package", "")
                  .strip()
              )

              upstream_version = (
                  pkg.get("Version", "")
                  .strip()
              )

              architecture = (
                  pkg.get(
                      "Architecture",
                      ""
                  ).strip()
              )

              if (
                  not package_id
                  or not upstream_version
                  or not architecture
              ):

                  continue

              current = local.get(key)

              try:

                  # ====================================================
                  # 本地已经存在
                  # ====================================================

                  if current:

                      # ------------------------------------------------
                      # 上游版本更高
                      # ------------------------------------------------

                      if version_gt(
                          upstream_version,
                          current["Version"]
                      ):

                          print()
                          print(
                              f"发现更新："
                              f"{package_id}"
                          )

                          print(
                              f"架构："
                              f"{architecture}"
                          )

                          print(
                              f"本地版本："
                              f"{current['Version']}"
                          )

                          print(
                              f"上游版本："
                              f"{upstream_version}"
                          )

                          print(
                              f"上游来源："
                              f"{pkg.get('_source', '未知')}"
                          )

                          temp, filename = (
                              download_and_validate(
                                  pkg
                              )
                          )

                          new_path = (
                              DEBS
                              / Path(
                                  filename
                              ).name
                          )

                          # ------------------------------------------------
                          # 文件名冲突
                          # ------------------------------------------------

                          if new_path.exists():

                              existing_info = (
                                  deb_info(new_path)
                              )

                              if (
                                  existing_info[
                                      "Package"
                                  ].lower()
                                  != package_id.lower()
                              ):

                                  temp.unlink()

                                  raise RuntimeError(
                                      "文件名冲突："
                                      f"{new_path}"
                                  )

                          # ------------------------------------------------
                          # 保存旧版本
                          # ------------------------------------------------

                          old_path = current[
                              "Path"
                          ]

                          if old_path.exists():

                              archive_dir = (
                                  ARCHIVE
                                  / package_id
                              )

                              archive_dir.mkdir(
                                  parents=True,
                                  exist_ok=True
                              )

                              archive_path = (
                                  archive_dir
                                  / old_path.name
                              )

                              if archive_path.exists():

                                  old_sha = sha256(
                                      old_path
                                  )

                                  archive_path = (
                                      archive_dir
                                      /
                                      f"{old_path.stem}."
                                      f"{old_sha[:8]}.deb"
                                  )

                              print(
                                  "保留历史版本："
                                  f"{current['Version']}"
                                  " → "
                                  f"{archive_path}"
                              )

                              shutil.move(
                                  str(old_path),
                                  str(archive_path)
                              )

                          # ------------------------------------------------
                          # 保存新版本
                          # ------------------------------------------------

                          shutil.copy2(
                              temp,
                              new_path
                          )

                          temp.unlink()

                          updated += 1

                          print(
                              "✓ 更新成功："
                              f"{package_id} "
                              f"{upstream_version}"
                          )

                      # ------------------------------------------------
                      # 版本相同
                      # ------------------------------------------------

                      elif version_eq(
                          upstream_version,
                          current["Version"]
                      ):

                          upstream_sha = (
                              pkg.get("SHA256")
                          )

                          if (
                              upstream_sha
                              and
                              current[
                                  "SHA256"
                              ].lower()
                              ==
                              upstream_sha.lower()
                          ):

                              skipped += 1

                              print(
                                  f"跳过："
                                  f"{package_id} "
                                  f"{upstream_version} "
                                  f"{architecture} "
                                  "（版本和内容相同）"
                              )

                          elif upstream_sha:

                              conflicts += 1

                              message = (
                                  "⚠ 同版本 "
                                  "SHA256 不一致："
                                  f"{package_id} "
                                  f"{upstream_version} "
                                  f"{architecture}\n"
                                  f"本地："
                                  f"{current['SHA256']}\n"
                                  f"上游："
                                  f"{upstream_sha}\n"
                                  "本次保留本地文件，"
                                  "不会覆盖。"
                              )

                              print()
                              print(
                                  "================================"
                              )

                              print(message)

                              print(
                                  "================================"
                              )

                              warnings.append(
                                  message
                              )

                              skipped += 1

                          else:

                              skipped += 1

                              print(
                                  f"跳过："
                                  f"{package_id} "
                                  f"{upstream_version} "
                                  f"{architecture} "
                                  "（版本相同）"
                              )

                      # ------------------------------------------------
                      # 本地版本更高
                      # ------------------------------------------------

                      else:

                          skipped += 1

                          print(
                              f"跳过："
                              f"{package_id} "
                              f"本地 "
                              f"{current['Version']} "
                              f"> 上游 "
                              f"{upstream_version} "
                              f"({architecture})"
                          )

                      continue

                  # ====================================================
                  # 新插件
                  # ====================================================

                  print()
                  print(
                      f"发现新插件："
                      f"{package_id} "
                      f"{upstream_version}"
                  )

                  print(
                      f"架构："
                      f"{architecture}"
                  )

                  print(
                      f"上游来源："
                      f"{pkg.get('_source', '未知')}"
                  )

                  temp, filename = (
                      download_and_validate(
                          pkg
                      )
                  )

                  new_path = (
                      DEBS
                      / Path(
                          filename
                      ).name
                  )

                  # ------------------------------------------------
                  # 文件名冲突
                  # ------------------------------------------------

                  if new_path.exists():

                      existing_info = (
                          deb_info(new_path)
                      )

                      if (
                          existing_info[
                              "Package"
                          ].lower()
                          != package_id.lower()
                      ):

                          temp.unlink()

                          raise RuntimeError(
                              "文件名冲突："
                              f"{new_path}"
                          )

                  # ------------------------------------------------
                  # 保存
                  # ------------------------------------------------

                  shutil.copy2(
                      temp,
                      new_path
                  )

                  temp.unlink()

                  added += 1

                  print(
                      "✓ 新插件添加成功："
                      f"{package_id} "
                      f"{upstream_version} "
                      f"{architecture}"
                  )

              except Exception as e:

                  # ====================================================
                  # 单个插件失败：
                  # 不终止整个 Workflow
                  # ====================================================

                  failed += 1

                  message = (
                      f"❌ 同步失败："
                      f"{package_id} "
                      f"{upstream_version} "
                      f"{architecture}\n"
                      f"来源："
                      f"{pkg.get('_source', '未知')}\n"
                      f"原因：{e}"
                  )

                  print()
                  print(
                      "================================"
                  )

                  print(message)

                  print(
                      "================================"
                  )

                  warnings.append(
                      message
                  )

                  continue

          # ============================================================
          # 清理 debs 中重复 Package + Architecture
          # ============================================================

          print()
          print(
              "================================"
          )

          print(
              "正在检查 debs 中是否存在重复版本..."
          )

          print(
              "================================"
          )

          package_files = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info[
                      "Package"
                  ]

                  architecture = info[
                      "Architecture"
                  ]

                  key = (
                      package_id.lower(),
                      architecture.lower()
                  )

                  package_files.setdefault(
                      key,
                      []
                  ).append(
                      (
                          path,
                          info["Version"],
                          package_id,
                          architecture
                      )
                  )

              except Exception:

                  continue

          for key, files in (
              package_files.items()
          ):

              if len(files) <= 1:
                  continue

              newest = files[0]

              for item in files[1:]:

                  if version_gt(
                      item[1],
                      newest[1]
                  ):

                      newest = item

              for (
                  path,
                  version,
                  package_id,
                  architecture
              ) in files:

                  if path == newest[0]:
                      continue

                  archive_dir = (
                      ARCHIVE
                      / package_id
                  )

                  archive_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  target = (
                      archive_dir
                      / path.name
                  )

                  if target.exists():

                      target = (
                          archive_dir
                          /
                          f"{path.stem}."
                          f"{sha256(path)[:8]}.deb"
                      )

                  print(
                      "移动历史版本："
                      f"{package_id} "
                      f"{version} "
                      f"{architecture}"
                  )

                  shutil.move(
                      str(path),
                      str(target)
                  )

          # ============================================================
          # 最终统计
          # ============================================================

          print()
          print(
              "================================"
          )

          print(
              "同步检查完成"
          )

          print(
              "================================"
          )

          print(
              f"新增插件：{added}"
          )

          print(
              f"更新插件：{updated}"
          )

          print(
              f"跳过插件：{skipped}"
          )

          print(
              f"SHA256 冲突：{conflicts}"
          )

          print(
              f"同步失败：{failed}"
          )

          if warnings:

              print()
              print(
                  "================================"
              )

              print(
                  "异常/失败插件汇总："
              )

              print(
                  "================================"
              )

              for warning in warnings:

                  print()
                  print(warning)

              print()
              print(
                  "================================"
              )

              print(
                  "以上插件未影响其他插件同步。"
              )

              print(
                  "================================"
              )

          PY

      - name: 重新生成 Packages
        run: |
          echo "正在重新生成 Packages..."

          dpkg-scanpackages debs /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -f Packages -o Packages.zst

          echo "Packages 生成完成。"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            debs \
            archive \
            Packages \
            Packages.gz \
            Packages.bz2 \
            Packages.xz \
            Packages.zst

          if git diff --cached --quiet; then

            echo "没有新的插件或更新。"

          else

            echo "发现文件变化，开始提交..."

            git commit \
              -m "自动同步 Wkkyy00 + Huayuarc 插件"

            git push

            echo "同步内容已经提交到仓库。"

          fi
