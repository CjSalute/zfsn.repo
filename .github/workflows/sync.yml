name: 同步 Wkkyy00 插件

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出自己的仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: 同步并检查插件
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import shutil
          import subprocess
          import tempfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          # ============================================================
          # 上游源
          # ============================================================

          UPSTREAM_PACKAGES = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/Packages"
          )

          UPSTREAM_BASE = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/"
          )

          DEBS = Path("debs")
          ARCHIVE = Path("archive")

          DEBS.mkdir(exist_ok=True)
          ARCHIVE.mkdir(exist_ok=True)

          # ============================================================
          # 下载文件
          # ============================================================

          def download_file(url, destination, retries=3):

              last_error = None

              for attempt in range(1, retries + 1):

                  try:

                      print(
                          f"下载尝试 {attempt}/{retries}"
                      )

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                              "Mozilla/5.0 "
                              "GitHub-Actions-Sileo-Sync"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          with open(
                              destination,
                              "wb"
                          ) as output:

                              while True:

                                  data = response.read(
                                      1024 * 1024
                                  )

                                  if not data:
                                      break

                                  output.write(data)

                      if (
                          destination.exists()
                          and destination.stat().st_size > 0
                      ):
                          return

                      raise RuntimeError(
                          "下载文件为空"
                      )

                  except Exception as e:

                      last_error = e

                      print(
                          f"下载失败：{e}"
                      )

                      if attempt < retries:

                          print(
                              "等待 5 秒后重试..."
                          )

                          time.sleep(5)

              raise RuntimeError(
                  f"下载失败，已重试 {retries} 次："
                  f"{last_error}"
              )

          # ============================================================
          # 获取上游 Packages
          # ============================================================

          print(
              "正在获取上游 Packages..."
          )

          packages_temp = Path(
              tempfile.mktemp()
          )

          try:

              download_file(
                  UPSTREAM_PACKAGES,
                  packages_temp
              )

              packages_text = (
                  packages_temp
                  .read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )

          finally:

              if packages_temp.exists():
                  packages_temp.unlink()

          # ============================================================
          # 解析 Packages
          # ============================================================

          def parse_packages(text):

              result = []
              current = {}

              for line in text.splitlines():

                  if not line.strip():

                      if current:
                          result.append(current)
                          current = {}

                      continue

                  # Debian Packages 中的续行
                  if (
                      line.startswith(" ")
                      or line.startswith("\t")
                  ):
                      continue

                  if ":" in line:

                      key, value = line.split(
                          ":",
                          1
                      )

                      current[
                          key.strip()
                      ] = value.strip()

              if current:
                  result.append(current)

              return result

          upstream = parse_packages(
              packages_text
          )

          print(
              f"上游发现 {len(upstream)} 个插件记录"
          )

          # ============================================================
          # .deb 信息
          # ============================================================

          def deb_info(path):

              def get(field):

                  return subprocess.check_output(
                      [
                          "dpkg-deb",
                          "-f",
                          str(path),
                          field
                      ],
                      text=True,
                      stderr=subprocess.STDOUT
                  ).strip()

              return {
                  "Package": get("Package"),
                  "Version": get("Version"),
                  "Architecture": get(
                      "Architecture"
                  )
              }

          # ============================================================
          # SHA256
          # ============================================================

          def sha256(path):

              h = hashlib.sha256()

              with open(
                  path,
                  "rb"
              ) as f:

                  while True:

                      data = f.read(
                          1024 * 1024
                      )

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          # ============================================================
          # 文件大小
          # ============================================================

          def file_size(path):

              return path.stat().st_size

          # ============================================================
          # 比较版本
          # ============================================================

          def version_gt(new, old):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      new,
                      "gt",
                      old
                  ]
              ).returncode == 0

          def version_eq(a, b):

              return subprocess.run(
                  [
                      "dpkg",
                      "--compare-versions",
                      a,
                      "eq",
                      b
                  ]
              ).returncode == 0

          # ============================================================
          # 扫描本地插件
          # ============================================================

          print(
              "正在检查本地插件..."
          )

          local = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info[
                      "Package"
                  ]

                  key = package_id.lower()

                  item = {
                      **info,
                      "Filename": path.name,
                      "Path": path,
                      "Size": file_size(path),
                      "SHA256": sha256(path)
                  }

                  if key not in local:

                      local[key] = item

                  else:

                      old = local[key]

                      if version_gt(
                          item["Version"],
                          old["Version"]
                      ):

                          local[key] = item

              except Exception as e:

                  print(
                      f"警告：无法读取 "
                      f"{path}: {e}"
                  )

          # ============================================================
          # 下载并严格验证 .deb
          # ============================================================

          def download_and_validate(pkg):

              package_id = pkg.get(
                  "Package",
                  ""
              ).strip()

              filename = pkg.get(
                  "Filename"
              )

              if not filename:

                  raise RuntimeError(
                      f"{package_id} "
                      "没有 Filename 字段"
                  )

              # 去除前后空格
              filename = filename.strip()

              # 去除 ./ 或多余 /
              while filename.startswith(
                  "./"
              ):

                  filename = filename[2:]

              filename = filename.lstrip("/")

              # 对 URL 中的特殊字符进行编码
              encoded_filename = quote(
                  filename,
                  safe="/"
              )

              url = (
                  UPSTREAM_BASE
                  + encoded_filename
              )

              print()
              print(
                  "正在下载："
                  f"{package_id} "
                  f"{pkg.get('Version', '')}"
              )

              print(
                  f"地址：{url}"
              )

              temp = Path(
                  tempfile.mktemp(
                      suffix=".deb"
                  )
              )

              try:

                  # 下载
                  download_file(
                      url,
                      temp,
                      retries=3
                  )

                  # ----------------------------------------------------
                  # 文件大小
                  # ----------------------------------------------------

                  actual_size = (
                      temp.stat().st_size
                  )

                  expected_size = pkg.get(
                      "Size"
                  )

                  if expected_size:

                      expected_size = int(
                          expected_size
                      )

                      if (
                          actual_size
                          != expected_size
                      ):

                          raise RuntimeError(
                              "文件大小不一致："
                              f"{actual_size} != "
                              f"{expected_size}"
                          )

                  print(
                      f"✓ 文件大小检查通过："
                      f"{actual_size} bytes"
                  )

                  # ----------------------------------------------------
                  # SHA256
                  # ----------------------------------------------------

                  actual_sha = sha256(
                      temp
                  )

                  expected_sha = pkg.get(
                      "SHA256"
                  )

                  if expected_sha:

                      if (
                          actual_sha.lower()
                          != expected_sha.lower()
                      ):

                          raise RuntimeError(
                              "SHA256 校验失败："
                              f"{actual_sha} != "
                              f"{expected_sha}"
                          )

                  print(
                      f"✓ SHA256 校验通过："
                      f"{actual_sha}"
                  )

                  # ----------------------------------------------------
                  # 读取 .deb 控制信息
                  # ----------------------------------------------------

                  info = deb_info(
                      temp
                  )

                  # ----------------------------------------------------
                  # Package
                  # ----------------------------------------------------

                  expected_package = (
                      pkg.get(
                          "Package",
                          ""
                      ).strip()
                  )

                  actual_package = (
                      info["Package"].strip()
                  )

                  # Package 名称允许大小写不同
                  if (
                      actual_package.lower()
                      != expected_package.lower()
                  ):

                      raise RuntimeError(
                          "Package 不一致："
                          f"{actual_package} != "
                          f"{expected_package}"
                      )

                  # ----------------------------------------------------
                  # Version
                  # ----------------------------------------------------

                  expected_version = (
                      pkg.get(
                          "Version",
                          ""
                      ).strip()
                  )

                  actual_version = (
                      info["Version"].strip()
                  )

                  if (
                      actual_version
                      != expected_version
                  ):

                      raise RuntimeError(
                          "Version 不一致："
                          f"{actual_version} != "
                          f"{expected_version}"
                      )

                  # ----------------------------------------------------
                  # Architecture
                  # ----------------------------------------------------

                  expected_arch = (
                      pkg.get(
                          "Architecture",
                          ""
                      ).strip()
                  )

                  actual_arch = (
                      info[
                          "Architecture"
                      ].strip()
                  )

                  if (
                      actual_arch
                      != expected_arch
                  ):

                      raise RuntimeError(
                          "Architecture 不一致："
                          f"{actual_arch} != "
                          f"{expected_arch}"
                      )

                  print(
                      "✓ Package 检查通过"
                  )

                  print(
                      "✓ Version 检查通过"
                  )

                  print(
                      "✓ Architecture 检查通过"
                  )

                  # ----------------------------------------------------
                  # .deb 完整性
                  # ----------------------------------------------------

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--info",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--contents",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  print(
                      "✓ .deb 完整性检查通过"
                  )

                  return (
                      temp,
                      filename
                  )

              except Exception:

                  if temp.exists():
                      temp.unlink()

                  raise

          # ============================================================
          # 开始同步
          # ============================================================

          for pkg in upstream:

              package_id = pkg.get(
                  "Package"
              )

              upstream_version = pkg.get(
                  "Version"
              )

              if (
                  not package_id
                  or not upstream_version
              ):
                  continue

              key = package_id.lower()

              current = local.get(
                  key
              )

              # ========================================================
              # 本地已经存在
              # ========================================================

              if current:

                  # 上游版本更高
                  if version_gt(
                      upstream_version,
                      current["Version"]
                  ):

                      print()
                      print(
                          "发现更新："
                          f"{package_id}"
                      )

                      print(
                          f"本地版本："
                          f"{current['Version']}"
                      )

                      print(
                          f"上游版本："
                          f"{upstream_version}"
                      )

                      (
                          temp,
                          filename
                      ) = download_and_validate(
                          pkg
                      )

                      new_path = (
                          DEBS
                          / Path(filename).name
                      )

                      # ------------------------------------------------
                      # 如果目标文件名已经存在
                      # ------------------------------------------------

                      if new_path.exists():

                          existing_info = (
                              deb_info(
                                  new_path
                              )
                          )

                          if (
                              existing_info[
                                  "Package"
                              ].lower()
                              != package_id.lower()
                          ):

                              temp.unlink()

                              raise RuntimeError(
                                  "文件名冲突："
                                  f"{new_path}"
                              )

                      # ------------------------------------------------
                      # 旧版本进入 archive
                      # ------------------------------------------------

                      old_path = current[
                          "Path"
                      ]

                      if old_path.exists():

                          archive_dir = (
                              ARCHIVE
                              / package_id
                          )

                          archive_dir.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          archive_path = (
                              archive_dir
                              / old_path.name
                          )

                          if archive_path.exists():

                              old_sha = sha256(
                                  old_path
                              )

                              archive_path = (
                                  archive_dir
                                  / (
                                      f"{old_path.stem}."
                                      f"{old_sha[:8]}.deb"
                                  )
                              )

                          print(
                              "保留历史版本："
                              f"{current['Version']} "
                              f"→ {archive_path}"
                          )

                          shutil.move(
                              str(old_path),
                              str(archive_path)
                          )

                      # ------------------------------------------------
                      # 新版本进入 debs
                      # ------------------------------------------------

                      shutil.copy2(
                          temp,
                          new_path
                      )

                      temp.unlink()

                      print(
                          "✓ 更新成功："
                          f"{package_id} "
                          f"{upstream_version}"
                      )

                  # ====================================================
                  # 版本相同
                  # ====================================================

                  elif version_eq(
                      upstream_version,
                      current["Version"]
                  ):

                      upstream_sha = pkg.get(
                          "SHA256"
                      )

                      if upstream_sha:

                          if (
                              current[
                                  "SHA256"
                              ].lower()
                              != upstream_sha.lower()
                          ):

                              raise RuntimeError(
                                  "\n"
                                  "安全检查失败："
                                  f"{package_id}\n"
                                  f"版本："
                                  f"{upstream_version}\n"
                                  "\n"
                                  "本地和上游版本相同，"
                                  "但 SHA256 不同。\n"
                                  "\n"
                                  f"本地："
                                  f"{current['SHA256']}\n"
                                  f"上游："
                                  f"{upstream_sha}\n"
                                  "\n"
                                  "为了防止上游静默替换"
                                  "同版本文件，"
                                  "本次同步已停止。"
                              )

                      print(
                          "跳过："
                          f"{package_id} "
                          f"{upstream_version} "
                          "（版本和内容相同）"
                      )

                  # ====================================================
                  # 本地版本更高
                  # ====================================================

                  else:

                      print(
                          "跳过："
                          f"{package_id} "
                          f"本地 {current['Version']} "
                          f"> 上游 {upstream_version}"
                      )

                  continue

              # ========================================================
              # 新插件
              # ========================================================

              print()
              print(
                  "发现新插件："
                  f"{package_id} "
                  f"{upstream_version}"
              )

              (
                  temp,
                  filename
              ) = download_and_validate(
                  pkg
              )

              new_path = (
                  DEBS
                  / Path(filename).name
              )

              if new_path.exists():

                  existing_info = deb_info(
                      new_path
                  )

                  if (
                      existing_info[
                          "Package"
                      ].lower()
                      != package_id.lower()
                  ):

                      temp.unlink()

                      raise RuntimeError(
                          "文件名冲突："
                          f"{new_path}"
                      )

              shutil.copy2(
                  temp,
                  new_path
              )

              temp.unlink()

              print(
                  "✓ 新插件添加成功："
                  f"{package_id} "
                  f"{upstream_version}"
              )

          # ============================================================
          # 清理 debs 中重复版本
          # ============================================================

          print()
          print(
              "正在检查 debs 中是否存在重复版本..."
          )

          package_files = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(
                      path
                  )

                  package_id = info[
                      "Package"
                  ]

                  key = package_id.lower()

                  package_files.setdefault(
                      key,
                      []
                  ).append(
                      (
                          path,
                          info["Version"],
                          package_id
                      )
                  )

              except Exception:

                  continue

          for key, files in package_files.items():

              if len(files) <= 1:
                  continue

              newest = files[0]

              for item in files[1:]:

                  if version_gt(
                      item[1],
                      newest[1]
                  ):

                      newest = item

              for path, version, package_id in files:

                  if path == newest[0]:
                      continue

                  archive_dir = (
                      ARCHIVE
                      / package_id
                  )

                  archive_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  target = (
                      archive_dir
                      / path.name
                  )

                  if target.exists():

                      target = (
                          archive_dir
                          / (
                              f"{path.stem}."
                              f"{sha256(path)[:8]}.deb"
                          )
                      )

                  print(
                      "移动历史版本："
                      f"{package_id} "
                      f"{version}"
                  )

                  shutil.move(
                      str(path),
                      str(target)
                  )

          print()
          print(
              "================================"
          )
          print(
              "同步检查全部完成"
          )
          print(
              "================================"
          )

          PY

      - name: 重新生成 Packages
        run: |
          echo "正在重新生成 Packages..."

          dpkg-scanpackages debs /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -f Packages -o Packages.zst

          echo "Packages 生成完成。"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            debs \
            archive \
            Packages \
            Packages.gz \
            Packages.bz2 \
            Packages.xz \
            Packages.zst

          if git diff --cached --quiet; then
            echo "没有新的插件或更新。"
          else
            echo "发现文件变化，开始提交..."

            git commit \
              -m "自动同步 Wkkyy00 插件"

            git push

            echo "同步内容已经提交到仓库。"
          fi
