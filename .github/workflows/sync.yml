name: 同步 Wkkyy00 插件

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出自己的仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: 同步并检查插件
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import shutil
          import subprocess
          import tempfile
          import urllib.request
          from pathlib import Path

          UPSTREAM_PACKAGES = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/Packages"
          )

          UPSTREAM_BASE = (
              "https://raw.githubusercontent.com/"
              "Wkkyy00/Wkkyy00.github.io/main/"
          )

          DEBS = Path("debs")
          ARCHIVE = Path("archive")

          DEBS.mkdir(exist_ok=True)
          ARCHIVE.mkdir(exist_ok=True)

          print("正在获取上游 Packages...")

          with urllib.request.urlopen(
              UPSTREAM_PACKAGES,
              timeout=30
          ) as r:
              packages_text = r.read().decode(
                  "utf-8",
                  errors="replace"
              )

          def parse_packages(text):
              result = []
              current = {}

              for line in text.splitlines():

                  if not line.strip():
                      if current:
                          result.append(current)
                          current = {}
                      continue

                  if line.startswith(" ") or line.startswith("\t"):
                      continue

                  if ":" in line:
                      key, value = line.split(":", 1)
                      current[key.strip()] = value.strip()

              if current:
                  result.append(current)

              return result

          upstream = parse_packages(packages_text)

          print(
              f"上游发现 {len(upstream)} 个插件记录"
          )

          def deb_info(path):

              def get(field):
                  return subprocess.check_output(
                      [
                          "dpkg-deb",
                          "-f",
                          str(path),
                          field
                      ],
                      text=True
                  ).strip()

              return {
                  "Package": get("Package"),
                  "Version": get("Version"),
                  "Architecture": get("Architecture")
              }

          def sha256(path):

              h = hashlib.sha256()

              with open(path, "rb") as f:

                  while True:

                      data = f.read(1024 * 1024)

                      if not data:
                          break

                      h.update(data)

              return h.hexdigest()

          def file_size(path):
              return path.stat().st_size

          print("正在检查本地插件...")

          local = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info["Package"]

                  item = {
                      **info,
                      "Filename": path.name,
                      "Path": path,
                      "Size": file_size(path),
                      "SHA256": sha256(path)
                  }

                  # Package 名称统一使用小写进行比较
                  key = package_id.lower()

                  if key not in local:

                      local[key] = item

                  else:

                      old = local[key]

                      newer = subprocess.run(
                          [
                              "dpkg",
                              "--compare-versions",
                              item["Version"],
                              "gt",
                              old["Version"]
                          ]
                      ).returncode == 0

                      if newer:
                          local[key] = item

              except Exception as e:

                  print(
                      f"警告：无法读取 {path}: {e}"
                  )

          def download_and_validate(pkg):

              filename = pkg.get("Filename")

              if not filename:

                  raise RuntimeError(
                      f"{pkg.get('Package')} 没有 Filename 字段"
                  )

              filename = filename.lstrip("./")

              url = UPSTREAM_BASE + filename

              print(
                  f"正在下载："
                  f"{pkg['Package']} "
                  f"{pkg['Version']}"
              )

              print(
                  f"地址：{url}"
              )

              temp = Path(
                  tempfile.mktemp(
                      suffix=".deb"
                  )
              )

              try:

                  urllib.request.urlretrieve(
                      url,
                      temp
                  )

                  if (
                      not temp.exists()
                      or temp.stat().st_size == 0
                  ):

                      raise RuntimeError(
                          "下载文件为空"
                      )

                  expected_size = pkg.get("Size")

                  if expected_size:

                      actual_size = temp.stat().st_size

                      if actual_size != int(
                          expected_size
                      ):

                          raise RuntimeError(
                              "文件大小不一致："
                              f"{actual_size} != "
                              f"{expected_size}"
                          )

                  expected_sha = pkg.get("SHA256")

                  actual_sha = sha256(temp)

                  if expected_sha:

                      if (
                          actual_sha.lower()
                          != expected_sha.lower()
                      ):

                          raise RuntimeError(
                              "SHA256 校验失败："
                              f"{actual_sha} != "
                              f"{expected_sha}"
                          )

                  info = deb_info(temp)

                  # Package 允许大小写不同
                  # Version 和 Architecture 必须完全一致
                  for field in [
                      "Package",
                      "Version",
                      "Architecture"
                  ]:

                      if not pkg.get(field):
                          continue

                      expected = pkg[field]
                      actual = info[field]

                      if field == "Package":

                          if (
                              actual.lower()
                              != expected.lower()
                          ):

                              raise RuntimeError(
                                  f"{field} 不一致："
                                  f"{actual} != "
                                  f"{expected}"
                              )

                      else:

                          if actual != expected:

                              raise RuntimeError(
                                  f"{field} 不一致："
                                  f"{actual} != "
                                  f"{expected}"
                              )

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--info",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  subprocess.run(
                      [
                          "dpkg-deb",
                          "--contents",
                          str(temp)
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL
                  )

                  print(
                      "✓ .deb 完整性检查通过"
                  )

                  print(
                      f"✓ SHA256：{actual_sha}"
                  )

                  return (
                      temp,
                      filename,
                      actual_sha
                  )

              except Exception:

                  if temp.exists():
                      temp.unlink()

                  raise

          for pkg in upstream:

              package_id = pkg.get("Package")
              upstream_version = pkg.get("Version")

              if (
                  not package_id
                  or not upstream_version
              ):
                  continue

              key = package_id.lower()

              current = local.get(key)

              if current:

                  newer = subprocess.run(
                      [
                          "dpkg",
                          "--compare-versions",
                          upstream_version,
                          "gt",
                          current["Version"]
                      ]
                  ).returncode == 0

                  if not newer:

                      same = subprocess.run(
                          [
                              "dpkg",
                              "--compare-versions",
                              upstream_version,
                              "eq",
                              current["Version"]
                          ]
                      ).returncode == 0

                      if same:

                          upstream_sha = pkg.get(
                              "SHA256"
                          )

                          if upstream_sha:

                              if (
                                  current["SHA256"].lower()
                                  != upstream_sha.lower()
                              ):

                                  raise RuntimeError(
                                      "\n安全检查失败："
                                      f"{package_id}\n"
                                      "本地版本与上游版本相同，"
                                      "但 SHA256 不同。\n"
                                      f"本地："
                                      f"{current['SHA256']}\n"
                                      f"上游："
                                      f"{upstream_sha}\n"
                                      "为了防止静默替换，"
                                      "已停止同步。"
                                  )

                          print(
                              f"跳过：{package_id} "
                              f"{current['Version']} "
                              "（版本和内容相同）"
                          )

                      else:

                          print(
                              f"跳过：{package_id} "
                              f"本地 {current['Version']} "
                              f"> 上游 {upstream_version}"
                          )

                      continue

              print(
                  "\n发现需要同步的插件："
                  f"{package_id} "
                  f"{upstream_version}"
              )

              (
                  temp,
                  filename,
                  new_sha
              ) = download_and_validate(pkg)

              new_path = DEBS / Path(
                  filename
              ).name

              # 文件名已经存在时检查其 Package
              if new_path.exists():

                  existing_info = deb_info(
                      new_path
                  )

                  if (
                      existing_info["Package"].lower()
                      != package_id.lower()
                  ):

                      temp.unlink()

                      raise RuntimeError(
                          f"文件名冲突：{new_path}"
                      )

              # 如果存在旧版本，把旧版本移动到 archive
              if (
                  current
                  and current["Path"].exists()
              ):

                  archive_dir = (
                      ARCHIVE / package_id
                  )

                  archive_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  old_path = current["Path"]

                  archive_path = (
                      archive_dir
                      / old_path.name
                  )

                  if archive_path.exists():

                      old_sha = sha256(
                          old_path
                      )

                      archive_path = (
                          archive_dir
                          / f"{old_path.stem}."
                          f"{old_sha[:8]}.deb"
                      )

                  print(
                      "保留历史版本："
                      f"{current['Version']} "
                      f"→ {archive_path}"
                  )

                  shutil.move(
                      str(old_path),
                      str(archive_path)
                  )

              shutil.copy2(
                  temp,
                  new_path
              )

              temp.unlink()

              print(
                  f"✓ 已更新："
                  f"{package_id} "
                  f"{upstream_version}"
              )

          print(
              "\n正在清理 debs 中的重复版本..."
          )

          package_files = {}

          for path in DEBS.glob("*.deb"):

              try:

                  info = deb_info(path)

                  package_id = info["Package"]

                  key = package_id.lower()

                  package_files.setdefault(
                      key,
                      []
                  ).append(
                      (
                          path,
                          info["Version"],
                          package_id
                      )
                  )

              except Exception:

                  continue

          for key, files in package_files.items():

              if len(files) <= 1:
                  continue

              newest = files[0]

              for item in files[1:]:

                  result = subprocess.run(
                      [
                          "dpkg",
                          "--compare-versions",
                          item[1],
                          "gt",
                          newest[1]
                      ]
                  )

                  if result.returncode == 0:
                      newest = item

              for path, version, package_id in files:

                  if path == newest[0]:
                      continue

                  archive_dir = (
                      ARCHIVE / package_id
                  )

                  archive_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  target = (
                      archive_dir
                      / path.name
                  )

                  if target.exists():

                      target = (
                          archive_dir
                          / f"{path.stem}."
                          f"{sha256(path)[:8]}.deb"
                      )

                  print(
                      f"移动历史版本："
                      f"{package_id} "
                      f"{version}"
                  )

                  shutil.move(
                      str(path),
                      str(target)
                  )

          print(
              "\n同步阶段完成。"
          )

          PY

      - name: 重新生成 Packages
        run: |
          dpkg-scanpackages debs /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -f Packages -o Packages.zst

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add debs archive Packages Packages.gz Packages.bz2 Packages.xz Packages.zst

          if git diff --cached --quiet; then
            echo "没有新的插件或更新。"
          else
            git commit -m "自动同步 Wkkyy00 插件"
            git push
          fi
