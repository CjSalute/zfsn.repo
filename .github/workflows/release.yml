#!/bin/bash

set -e

REPO="CjSalute/zfsn.repo"
TOKEN_FILE="$HOME/.config/zfsn/github_token"

if [ $# -ne 1 ]; then
    echo "用法："
    echo "upload-deb /路径/插件.deb"
    exit 1
fi

FILE="$1"

if [ ! -f "$FILE" ]; then
    echo "错误：文件不存在"
    exit 1
fi

case "$FILE" in
    *.deb)
        ;;
    *)
        echo "错误：必须选择 .deb 文件"
        exit 1
        ;;
esac

if [ ! -f "$TOKEN_FILE" ]; then
    echo "错误：GitHub Token 不存在"
    echo "请先创建：$TOKEN_FILE"
    exit 1
fi

TOKEN="$(cat "$TOKEN_FILE")"

NAME="$(basename "$FILE")"

# 创建唯一临时 Release
TAG="phone-upload-$(date +%Y%m%d-%H%M%S)-$$"

echo "================================"
echo "准备上传插件"
echo "================================"
echo "仓库：$REPO"
echo "文件：$NAME"
echo "标签：$TAG"
echo "================================"

echo "正在创建临时 Release..."

RELEASE_JSON="$(
curl --fail-with-body -sS \
    -X POST \
    -H "Authorization: Bearer $TOKEN" \
    -H "Accept: application/vnd.github+json" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    "https://api.github.com/repos/$REPO/releases" \
    -d "$(jq -n \
        --arg tag "$TAG" \
        --arg name "Phone Upload $NAME" \
        '{
            tag_name: $tag,
            name: $name,
            draft: true,
            prerelease: true
        }')"
)"

RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"

UPLOAD_URL="$(
    printf '%s' "$RELEASE_JSON" |
    jq -r '.upload_url' |
    sed 's/{?name,label}//'
)"

if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
    echo "错误：创建 Release 失败"
    exit 1
fi

echo "✓ Release 创建成功"
echo "Release ID：$RELEASE_ID"

# URL 编码文件名
ENCODED_NAME="$(
    printf '%s' "$NAME" |
    jq -sRr @uri
)"

echo
echo "正在上传 .deb..."
echo "文件名：$NAME"

curl --fail-with-body -sS \
    -X POST \
    -H "Authorization: Bearer $TOKEN" \
    -H "Accept: application/vnd.github+json" \
    -H "Content-Type: application/octet-stream" \
    --data-binary @"$FILE" \
    "$UPLOAD_URL?name=$ENCODED_NAME" \
    >/dev/null

echo "✓ .deb 上传成功"

echo
echo "正在发布 Release..."

curl --fail-with-body -sS \
    -X PATCH \
    -H "Authorization: Bearer $TOKEN" \
    -H "Accept: application/vnd.github+json" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" \
    -d '{"draft":false}' \
    >/dev/null

echo
echo "================================"
echo "✓ 云端上传成功"
echo "================================"
echo "GitHub Actions 即将自动处理："
echo
echo "1. 下载 .deb"
echo "2. 检查 Package"
echo "3. 检查 Version"
echo "4. 检查 Architecture"
echo "5. SHA256 校验"
echo "6. 判断是否为新版本"
echo "7. 旧版本移动到 archive"
echo "8. 新版本进入 debs"
echo "9. 重新生成 Packages"
echo "10. 提交 GitHub"
echo "11. 删除临时 Release"
echo
echo "手机本地不需要 git pull。"
echo "================================"