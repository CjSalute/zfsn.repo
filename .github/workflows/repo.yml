name: Build Repo

on:
  push:
    paths:
      - 'debs/*.deb'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dpkg tools
      run: |
        sudo apt update
        sudo apt install dpkg-dev -y

    - name: Generate Packages
      run: |
        dpkg-scanpackages debs /dev/null > Packages
        gzip -kf Packages

    - name: Generate Release
      run: |
        echo "Origin: CRCTDD Repo" > Release
        echo "Label: CRCTDD Repo" >> Release
        echo "Suite: stable" >> Release
        echo "Version: 1.0" >> Release
        echo "Codename: ios" >> Release
        echo "Architecture: iphoneos-arm64" >> Release
        echo "Description: CRCTDD Jailbreak Repo" >> Release

    - name: Commit generated files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add Packages Packages.gz Release
        git commit -m "Auto generate repo files" || echo "No changes"

    - name: Push changes
      run: |
        git push
