name: "refresh"

on:
  push:
    paths:
      - 'debs/**/*.deb'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update -qq
          sudo apt install dpkg-dev bzip2 xz-utils zstd -y

      - name: Refresh Packages
        run: |
          mkdir -p repo
          rm -rf ./repo/Packages*
          dpkg-scanpackages -m ./debs /dev/null >./repo/Packages
          bzip2 -v -k -9 ./repo/Packages
          xz -v -k -9 --extreme ./repo/Packages
          zstd --ultra -22 -k ./repo/Packages -o ./repo/Packages.zst
          cat > ./repo/Release << EOF
Origin: crctdd Repo
Label: crctdd Repo
Suite: stable
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: crctdd Repo
EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
