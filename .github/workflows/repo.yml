name: Build Repo

on:
  push:
    paths:
      - 'debs/**/*.deb'
  workflow_dispatch:  

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dpkg
        run: sudo apt update && sudo apt install dpkg-dev -y
      - name: Make repo files
        run: |
          mkdir -p repo
          dpkg-scanpackages -m debs /dev/null > repo/Packages || true
          gzip -kf repo/Packages || true
          echo -e "Origin: crctdd Repo\nLabel: crctdd Repo\nSuite: stable\nCodename: ios\nArchitectures: iphoneos-arm64\nComponents: main\nDescription: crctdd Repo" > repo/Release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
